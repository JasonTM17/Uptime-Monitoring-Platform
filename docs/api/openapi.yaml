openapi: 3.1.1
info:
  title: Uptime Monitoring Platform — Public API
  version: 0.3.0
  description: |
    Owner-scoped public API contract. Every JSON response uses the
    envelope below: success wraps the payload in `data`, failure wraps
    `error` and always carries `request_id`. All responses are
    `Cache-Control: no-store`.

    **Authentication.** Session cookie `uptime_session` (HttpOnly,
    SameSite=Lax). Obtain it via `POST /auth/login`; identify the
    caller with `GET /auth/me`.

    **CSRF.** State-changing routes require the double-submit pair:
    the `uptime_csrf` cookie issued by `GET /auth/csrf` plus the same
    token in the `X-CSRF-Token` header, and a matching `Origin`
    header when Origin is sent. Missing/mismatched pairs are
    `403 CSRF_REJECTED`.

    **Optimistic concurrency.** Mutations on existing resources take
    `expected_generation` (monitors) or `expected_version` (channels)
    in the body. A stale fence is `409 CONFLICT`; re-read and retry.

    **Planned surface.** Operations tagged `planned` are contract
    drafts reserved for later cards (engine, delivery, admin). They
    are marked `x-future: true`, are NOT implemented, and are excluded
    from route parity checks.
  contact: {}
servers:
  - url: http://127.0.0.1:8080
    description: local
tags:
  - name: health
  - name: auth
  - name: monitors
  - name: notification-channels
  - name: planned
    description: Reserved contract surface — NOT implemented.

paths:
  /health/live:
    get:
      tags: [health]
      summary: Process liveness (never touches dependencies)
      operationId: healthLive
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
              example: { status: ok }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
  /health/ready:
    get:
      tags: [health]
      summary: Dependency readiness (DB-verified probe)
      operationId: healthReady
      responses:
        '200':
          description: Dependencies ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
              example: { status: ready }
        '503':
          description: A dependency is down
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
              example: { status: unavailable }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  /auth/csrf:
    get:
      tags: [auth]
      summary: Issue a CSRF token + cookie pair
      operationId: csrfChallenge
      responses:
        '200':
          description: Token issued; `uptime_csrf` cookie set
          headers:
            Set-Cookie:
              schema: { type: string }
              description: uptime_csrf=<token>; Path=/; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
                properties:
                  data:
                    type: object
                    required: [csrf_token]
                    properties:
                      csrf_token: { type: string }
              example:
                data: { csrf_token: "9f3d2c1b-example-token" }

  /auth/register:
    post:
      tags: [auth]
      summary: Register an account
      operationId: register
      parameters:
        - $ref: '#/components/parameters/CSRFGuard'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
            example:
              email: user@example.com
              password: "<your-12+-char-password>"
              display_name: Ada
      responses:
        '201':
          description: Account created (monitor_limit stamped server-side)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/CSRFRejected' }
        '409':
          description: Registration could not be completed (anti-enumeration fixed message)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: CONFLICT, message: registration could not be completed }
                request_id: "req_01H…"
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/login:
    post:
      tags: [auth]
      summary: Log in (sets uptime_session cookie)
      operationId: login
      parameters:
        - $ref: '#/components/parameters/CSRFGuard'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
            example:
              email: user@example.com
              password: "<your-12+-char-password>"
      responses:
        '200':
          description: Session created
          headers:
            Set-Cookie:
              schema: { type: string }
              description: uptime_session=<opaque>; HttpOnly; Path=/; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
                properties:
                  data:
                    type: object
                    required: [user, session_expires_at]
                    properties:
                      user: { $ref: '#/components/schemas/User' }
                      session_expires_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Invalid credentials — unknown, disabled, and wrong password are indistinguishable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: UNAUTHENTICATED, message: invalid credentials }
                request_id: "req_01H…"
        '403': { $ref: '#/components/responses/CSRFRejected' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/logout:
    post:
      tags: [auth]
      summary: Log out (idempotent; clears the cookie)
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/CSRFGuard'
      responses:
        '200':
          description: Logged out (always, even without a valid session)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: { type: string, enum: [logged_out] }
              example: { data: { status: logged_out } }
        '403': { $ref: '#/components/responses/CSRFRejected' }

  /auth/me:
    get:
      tags: [auth]
      summary: Current principal
      operationId: me
      responses:
        '200':
          description: Caller identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
                properties:
                  data:
                    type: object
                    required: [user, session_expires_at]
                    properties:
                      user: { $ref: '#/components/schemas/User' }
                      session_expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/sessions:
    get:
      tags: [auth]
      summary: List own sessions (bounded page)
      operationId: listOwnSessions
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Own session inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
                properties:
                  data:
                    type: object
                    required: [sessions, page, page_size]
                    properties:
                      sessions:
                        type: array
                        items: { $ref: '#/components/schemas/SessionDTO' }
                      page: { type: integer }
                      page_size: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/sessions/{id}:
    delete:
      tags: [auth]
      summary: Revoke one own session (foreign IDs are 404)
      operationId: revokeOwnSession
      parameters:
        - $ref: '#/components/parameters/CSRFGuard'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CSRFRejected' }
        '404': { $ref: '#/components/responses/NotFound' }

  /auth/reauth:
    post:
      tags: [auth]
      summary: Verify password and stamp recent-auth on this session
      operationId: reauth
      description: Step-up receipt for sensitive actions. The
        server-side `recent_auth_at` is valid for 5 minutes; a client
        can never set it directly. Uniform 401 for wrong password.
      parameters:
        - $ref: '#/components/parameters/CSRFGuard'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password }
      responses:
        '200':
          description: Recent-auth stamped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
                properties:
                  data:
                    type: object
                    required: [reauthenticated_until]
                    properties:
                      reauthenticated_until: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CSRFRejected' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/sessions/revoke-all:
    post:
      tags: [auth]
      summary: Revoke every session the caller owns (log out everywhere)
      operationId: revokeAllOwnSessions
      description: Requires recent authentication inside the 5-minute
        step-up window. Bumps the security epoch, revokes all sessions
        including the current one, and clears the session cookie.
      parameters:
        - $ref: '#/components/parameters/CSRFGuard'
      responses:
        '200':
          description: All sessions revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
                properties:
                  data:
                    type: object
                    required: [revoked_count]
                    properties:
                      revoked_count: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: CSRF rejected OR recent authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                reauth:
                  value:
                    error:
                      code: REAUTH_REQUIRED
                      message: recent authentication required

  /monitors:
    post:
      tags: [monitors]
      summary: Create a monitor
      operationId: createMonitor
      parameters:
        - $ref: '#/components/parameters/CSRFGuard'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MonitorCreateInput' }
            example:
              name: marketing-site
              target_url: https://example.com/health
              interval_seconds: 300
              timeout_seconds: 5
              expected_status: 200
      responses:
        '201':
          description: Created
          headers:
            Location: { schema: { type: string }, description: "/monitors/{id}" }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
                properties:
                  data: { $ref: '#/components/schemas/Monitor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CSRFRejected' }
        '409':
          description: Quota bound reached — scope tells WHICH cap, never global counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                ownerLimit:
                  value:
                    error:
                      code: QUOTA_EXCEEDED
                      message: monitor limit reached
                      fields: { scope: owner_monitor_limit }
                    request_id: "req_01H…"
                platformAdmission:
                  value:
                    error:
                      code: QUOTA_EXCEEDED
                      message: monitor limit reached
                      fields: { scope: platform_admission }
                    request_id: "req_01H…"
                retained:
                  value:
                    error:
                      code: ALLOCATION_LIMIT_REACHED
                      message: monitor allocation limit reached
                      fields: { scope: monitors }
                    request_id: "req_01H…"
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [monitors]
      summary: List own monitors (keyset-paginated)
      operationId: listMonitors
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: paused
          in: query
          schema: { type: string, enum: ['true', 'false'] }
        - name: health
          in: query
          schema: { type: string, enum: [UNKNOWN, UP, DOWN] }
        - name: q
          in: query
          description: Escaped substring match on name
          schema: { type: string, maxLength: 120 }
        - name: cursor
          in: query
          description: |
            Opaque keyset resume token (`m1.<base64url>`). Bound to the
            filter set it was issued under — resuming with different
            filters is 400.
          schema: { type: string, maxLength: 512 }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
                properties:
                  data:
                    type: object
                    required: [items, has_more, next_cursor]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Monitor' }
                      has_more: { type: boolean }
                      next_cursor: { type: [string, 'null'] }
        '400':
          description: Invalid cursor (malformed, foreign-version, or filter-mismatched)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: BAD_REQUEST, message: invalid cursor }
                request_id: "req_01H…"
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /monitors/{id}:
    get:
      tags: [monitors]
      summary: Read one own monitor (foreign IDs are 404)
      operationId: getMonitor
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: The monitor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
                properties:
                  data: { $ref: '#/components/schemas/Monitor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [monitors]
      summary: Update mutable fields under the generation fence
      operationId: patchMonitor
      parameters:
        - $ref: '#/components/parameters/CSRFGuard'
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_generation]
              allOf:
                - $ref: '#/components/schemas/MonitorPatchInput'
              unevaluatedProperties: false
              properties:
                expected_generation: { type: integer, minimum: 1 }
            example:
              expected_generation: 3
              name: marketing-site-v2
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
                properties:
                  data: { $ref: '#/components/schemas/Monitor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CSRFRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/GenerationConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [monitors]
      summary: Soft-delete under the generation fence
      operationId: deleteMonitor
      parameters:
        - $ref: '#/components/parameters/CSRFGuard'
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpectedGeneration' }
            example: { expected_generation: 3 }
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CSRFRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/GenerationConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /monitors/{id}/pause:
    post:
      tags: [monitors]
      summary: Pause scheduling (idempotent; does not mark DOWN)
      operationId: pauseMonitor
      parameters:
        - $ref: '#/components/parameters/CSRFGuard'
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpectedGeneration' }
            example: { expected_generation: 3 }
      responses:
        '200':
          description: Paused (same-state pause is a no-op success)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
                properties:
                  data: { $ref: '#/components/schemas/Monitor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CSRFRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/GenerationConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /monitors/{id}/resume:
    post:
      tags: [monitors]
      summary: Resume scheduling (idempotent; does not fabricate a check)
      operationId: resumeMonitor
      parameters:
        - $ref: '#/components/parameters/CSRFGuard'
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpectedGeneration' }
            example: { expected_generation: 4 }
      responses:
        '200':
          description: Resumed; next_check_at reset to now() as eligibility
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
                properties:
                  data: { $ref: '#/components/schemas/Monitor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CSRFRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/GenerationConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /monitors/{id}/notification-channels:
    put:
      tags: [monitors]
      summary: Atomically replace the monitor's channel binding set
      description: |
        Full replacement under the generation fence (one winner among
        same-generation writers). Every listed channel must be owned,
        VERIFIED, and enabled — a single ineligible id fails the whole
        set with no partial update. Empty `channel_ids` is a legitimate
        unbind. Duplicates collapse server-side.
      operationId: replaceMonitorChannels
      parameters:
        - $ref: '#/components/parameters/CSRFGuard'
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_generation, channel_ids]
              additionalProperties: false
              properties:
                expected_generation: { type: integer, minimum: 1 }
                channel_ids:
                  type: array
                  items: { type: string, format: uuid }
            example:
              expected_generation: 4
              channel_ids: ["018f2f2a-7e51-7a2c-9a02-1f7f9b2d0a11"]
      responses:
        '200':
          description: Binding set replaced; generation incremented once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
                properties:
                  data:
                    type: object
                    required: [monitor_id, generation, channel_ids]
                    properties:
                      monitor_id: { type: string, format: uuid }
                      generation: { type: integer }
                      channel_ids:
                        type: array
                        items: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CSRFRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/GenerationConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /monitors/{id}/checks:
    get:
      tags: [monitors, history]
      summary: Page check-run history (newest first, keyset cursor)
      description: |
        Owner-scoped run history over the nominal slot grid. `slot_at`
        is the scheduled slot; `observed_at` is the real observation
        timestamp — they are separate labels on purpose. Runs without
        an accepted result carry null outcome fields. Max range 30d.
      operationId: listMonitorChecks
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: A page of check history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
                properties:
                  data:
                    type: object
                    properties:
                      checks:
                        type: array
                        items: { $ref: '#/components/schemas/CheckHistoryRow' }
                      page: { $ref: '#/components/schemas/Page' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /monitors/{id}/incidents:
    get:
      tags: [monitors, history]
      summary: Page incident history (open or resolved filter)
      operationId: listMonitorIncidents
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: state
          in: query
          schema: { type: string, enum: [open, resolved] }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: A page of incidents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
                properties:
                  data:
                    type: object
                    properties:
                      incidents:
                        type: array
                        items: { $ref: '#/components/schemas/IncidentRow' }
                      page: { $ref: '#/components/schemas/Page' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /monitors/{id}/stats:
    get:
      tags: [monitors, statistics]
      summary: Weighted sampled statistics over a fixed window
      description: |
        `window_start/end` echo the REQUEST; `data_start/end` are the
        REPRESENTED half-open interval — every count, ratio and the
        denominator share it. Ratios are null with no evidence; a
        truncated window sets `is_partial`. Hourly aggregates merge
        with uncovered raw slots; nothing double-counts and no
        percentages are averaged.
      operationId: getMonitorStats
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: window
          in: query
          schema: { type: string, enum: [24h, 7d, 30d], default: 24h }
      responses:
        '200':
          description: Sampled statistics projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
                properties:
                  data: { $ref: '#/components/schemas/MonitorStats' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /dashboard/summary:
    get:
      tags: [dashboard]
      summary: Owner dashboard snapshot with authoritative quota
      description: |
        One consistent read: monitor counts, open incidents, the
        bounded recent-incident strip, 24h weighted sampled uptime,
        and the own quota projection — `used` counts every nondeleted
        monitor of the caller regardless of filters.
      operationId: getDashboardSummary
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
                properties:
                  data: { $ref: '#/components/schemas/DashboardSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /notification-channels:
    post:
      tags: [notification-channels]
      summary: Create a pending channel (label only)
      description: |
        Browser input is metadata ONLY — `{label}`. The destination is
        sealed by the operator CLI after out-of-band owner consent
        verification; it never crosses a browser request. A pending
        channel consumes the pending AND retained allocation budgets,
        including after soft-delete (tombstoned pending still counts).
      operationId: createChannel
      parameters:
        - $ref: '#/components/parameters/CSRFGuard'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelCreateInput' }
            example: { label: telegram-oncall }
      responses:
        '201':
          description: Pending channel created
          headers:
            Location:
              schema: { type: string }
              description: "/notification-channels/{id}"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
                properties:
                  data: { $ref: '#/components/schemas/Channel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CSRFRejected' }
        '409':
          description: Pending or retained allocation bound reached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                pending:
                  value:
                    error:
                      code: ALLOCATION_LIMIT_REACHED
                      message: pending channel limit reached
                      fields: { scope: pending_channels }
                    request_id: "req_01H…"
                retained:
                  value:
                    error:
                      code: ALLOCATION_LIMIT_REACHED
                      message: channel allocation limit reached
                      fields: { scope: channels }
                    request_id: "req_01H…"
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [notification-channels]
      summary: List own channels (live rows only)
      operationId: listChannels
      responses:
        '200':
          description: Owned channels
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
                properties:
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Channel' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /notification-channels/{id}:
    get:
      tags: [notification-channels]
      summary: Read one own channel (foreign IDs are 404)
      operationId: getChannel
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: The channel — mask only, never the destination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
                properties:
                  data: { $ref: '#/components/schemas/Channel' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [notification-channels]
      summary: Soft-delete under the version fence (audit preserved)
      operationId: deleteChannel
      parameters:
        - $ref: '#/components/parameters/CSRFGuard'
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpectedVersion' }
            example: { expected_version: 2 }
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CSRFRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/GenerationConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /notification-channels/{id}/disable:
    post:
      tags: [notification-channels]
      summary: Disable a channel (history preserved; unbinds eligibility)
      description: |
        Disabling flips `enabled=false` and status to DISABLED under the
        version fence. Verification receipt, mask, and ciphertext are
        retained — disable is a lifecycle state, not an erasure. A
        disabled channel fails binding eligibility; unsent events are
        the delivery phase's concern, not this route's.
      operationId: disableChannel
      parameters:
        - $ref: '#/components/parameters/CSRFGuard'
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpectedVersion' }
            example: { expected_version: 2 }
      responses:
        '200':
          description: Disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
                properties:
                  data: { $ref: '#/components/schemas/Channel' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CSRFRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/GenerationConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ------------------------------------------------------------------
  # Planned surface — contract drafts, NOT implemented. Every operation
  # below carries x-future: true and is excluded from parity checks.
  # ------------------------------------------------------------------
  /summary:
    get:
      tags: [planned]
      summary: (C50) Owner usage summary — typed quota schema
      x-future: true
      operationId: plannedSummary
      responses:
        '200':
          description: Draft — typed quota block per F09
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
                properties:
                  data:
                    type: object
                    required: [quota]
                    properties:
                      quota:
                        type: object
                        required: [used, active, paused, limit, profile, as_of, source]
                        properties:
                          used: { type: integer }
                          active: { type: integer }
                          paused: { type: integer }
                          limit: { type: integer }
                          profile: { type: string, enum: [local, hosted] }
                          as_of: { type: string, format: date-time }
                          source: { type: string, enum: [stamped, default, override] }

  /notification-channels/{id}/test:
    post:
      tags: [notification]
      summary: Queue one TEST intent (recent-auth required — 202 is queued, not delivered)
      operationId: testNotificationChannel
      parameters:
        - $ref: '#/components/parameters/CSRFGuard'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '202':
          description: TEST intent persisted — the dispatcher claims and sends it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '200': { description: Same-window duplicate — existing intent stands }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Channel unbound or unverified }
        '429': { $ref: '#/components/responses/RateLimited' }

  /incidents:
    get:
      tags: [planned]
      summary: (engine phase) Incident timeline
      x-future: true
      operationId: plannedIncidents
      responses:
        '200': { description: Draft }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /admin/overview:
    get:
      tags: [admin]
      summary: Platform pulse — counts + dependency freshness (platform:read)
      operationId: adminOverview
      responses:
        '200':
          description: >
            users/monitors/sessions/incidents/outbox counts, engine
            heartbeat freshness ("fresh"|"stale"|"absent"), db reachable.
            No secrets — never raw metrics or provider data.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '503': { description: Dependency unavailable (not a healthy zero) }

  /admin/users:
    get:
      tags: [admin]
      summary: Bounded user inventory — search/status/role + cursor (users:read)
      operationId: listAdminUsers
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 120 },
            description: Email substring }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, DISABLED] } }
        - { name: role_id, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string },
            description: Keyset cursor bound to the filter set }
      responses:
        '200':
          description: >
            { users[], next_cursor } — safe projection only (no password
            hash, TOTP material, or session tokens; counts are precomputed).
            Keyset on (created_at,id) DESC — equal timestamps never dup/skip.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '400': { description: Invalid/mismatched cursor or unknown filter value }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '503': { description: Dependency unavailable }

  /admin/users/{id}:
    get:
      tags: [admin]
      summary: One account — fields + monitor/session counts (users:read)
      operationId: getAdminUser
      parameters: [ { $ref: '#/components/parameters/IdPath' } ]
      responses:
        '200': { description: Safe account projection + counts }
        '400': { description: Malformed id }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Dependency unavailable }

  /admin/monitors:
    get:
      tags: [admin]
      summary: Global monitor inventory — redacted (monitors:global:read)
      operationId: listAdminMonitors
      parameters:
        - { name: owner_id, in: query, schema: { type: string, format: uuid } }
        - { name: paused, in: query, schema: { type: string, enum: ['true','false'] } }
        - { name: health, in: query, schema: { type: string, enum: [UP, DOWN, UNKNOWN] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: >
            { monitors[], next_cursor } — target reduced to scheme+host;
            path/query secrets never leave the store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '400': { description: Invalid cursor or filter }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '503': { description: Dependency unavailable }

  /admin/operations:
    get:
      tags: [admin]
      summary: Ops health — engine/queue/outbox/rollup freshness (operations:read)
      operationId: adminOperations
      responses:
        '200':
          description: >
            engine epoch/owner/heartbeat freshness, reserved+running
            runs, outbox state + oldest pending age, rollup last-bucket
            freshness. Explicit "absent" when evidence is missing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '503': { description: Dependency unavailable }

  /admin/outbox:
    get:
      tags: [admin]
      summary: Outbox inventory — lifecycle only (deliveries:read)
      operationId: listAdminOutbox
      parameters:
        - { name: state, in: query, schema: { type: string,
            enum: [PENDING, LEASED, SENT, DEAD, SUPPRESSED] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: >
            { deliveries[], next_cursor } — state/attempts/version only;
            payload and destination never leave the store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '400': { description: Invalid cursor or filter }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '503': { description: Dependency unavailable }

  /admin/audit-events:
    get:
      tags: [admin]
      summary: Audit inventory — bounded window + cursor (audit:read)
      operationId: listAdminAuditEvents
      parameters:
        - { name: action, in: query, schema: { type: string, maxLength: 60 } }
        - { name: actor, in: query, schema: { type: string, format: uuid } }
        - { name: subject, in: query, schema: { type: string, maxLength: 80 } }
        - { name: from, in: query, schema: { type: string, format: date-time },
            description: Window lower bound — range capped at 90 days }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: >
            { events[], next_cursor } — safe_diff is redacted at write;
            the projection adds no new sensitive data.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '400': { description: Invalid cursor, filter, or >90d window }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '503': { description: Dependency unavailable }

  /admin/audit-events/{id}:
    get:
      tags: [admin]
      summary: One redacted audit record (audit:read)
      operationId: getAdminAuditEvent
      parameters: [ { $ref: '#/components/parameters/IdPath' } ]
      responses:
        '200': { description: Audit row with safe_diff }
        '400': { description: Malformed id }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Dependency unavailable }

  /admin/roles:
    get:
      tags: [admin]
      summary: Role + permission catalog with delegation ceiling
      operationId: listAdminRoles
      responses:
        '200':
          description: Catalog, presets, custom roles, ceiling, requires
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      summary: Create a bounded custom role (SUPER_ADMIN only)
      operationId: createAdminRole
      parameters:
        - $ref: '#/components/parameters/CSRFGuard'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Role created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: missing_permissions (unmet read prerequisites) or over-ceiling grants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error:
                  code: VALIDATION_ERROR
                  message: validation failed
                  fields: { missing_permissions: "users:read" }
                request_id: "req_01H…"

  /admin/roles/{id}:
    patch:
      tags: [admin]
      summary: Replace a custom role's grant set (presets immutable)
      operationId: updateAdminRole
      parameters:
        - $ref: '#/components/parameters/CSRFGuard'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Role updated; every holder's security epoch advanced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/users/{id}/roles:
    put:
      tags: [admin]
      summary: Replace one user's role set atomically
      operationId: assignUserRoles
      parameters:
        - $ref: '#/components/parameters/CSRFGuard'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Role set replaced; subject security epoch advanced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Stale expected_version, conflicting idempotency key, or LAST_SUPERADMIN
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error:
                  code: LAST_SUPERADMIN
                  message: the last active superadmin cannot be removed
                request_id: "req_01H…"
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/users/{id}/suspend:
    post:
      tags: [admin]
      summary: Disable an account — epoch bump, session revoke, segment close, generation fence
      operationId: suspendAdminUser
      parameters:
        - $ref: '#/components/parameters/CSRFGuard'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Account disabled (idempotent — repeated suspend returns already:true)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Stale expected_version or LAST_SUPERADMIN
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error:
                  code: LAST_SUPERADMIN
                  message: the last active superadmin cannot be removed
                request_id: "req_01H…"
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/users/{id}/restore:
    post:
      tags: [admin]
      summary: Re-activate a disabled account — sessions and removed grants stay revoked
      operationId: restoreAdminUser
      parameters:
        - $ref: '#/components/parameters/CSRFGuard'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Account active (eligible monitors due at first future slot)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/users/{id}/revoke-sessions:
    post:
      tags: [admin]
      summary: Revoke every live session of a user (sessions:manage)
      operationId: revokeUserSessions
      parameters:
        - $ref: '#/components/parameters/CSRFGuard'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Sessions revoked (count only — no tokens or client data)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/users/{id}/quota:
    patch:
      tags: [admin]
      summary: Set a user's live monitor cap (quotas:manage — SUPER_ADMIN only)
      operationId: setUserQuota
      parameters:
        - $ref: '#/components/parameters/CSRFGuard'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Cap updated (bounded counts, no resource data)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Cap below locked usage or above pinned ceilings; nothing is auto-deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error:
                  code: QUOTA_EXCEEDED
                  message: quota cap below current usage
                request_id: "req_01H…"
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/monitors/{id}/pause:
    post:
      tags: [admin]
      summary: Pause any monitor globally (monitors:operate) — closes the open segment
      operationId: pauseAdminMonitor
      parameters:
        - $ref: '#/components/parameters/CSRFGuard'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Monitor paused; generation bumped }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/monitors/{id}/resume:
    post:
      tags: [admin]
      summary: Resume any monitor globally — due at first future slot, never check-now
      operationId: resumeAdminMonitor
      parameters:
        - $ref: '#/components/parameters/CSRFGuard'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Monitor resumed; generation bumped }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Stale generation or suspended owner }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/outbox/{id}/retry:
    post:
      tags: [admin]
      summary: Re-arm one DEAD stream head (deliveries:retry) — 202 re-queued
      operationId: retryAdminDelivery
      parameters:
        - $ref: '#/components/parameters/CSRFGuard'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '202': { description: Head re-armed PENDING with a fresh attempt budget }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Not DEAD, stale version, or live predecessor }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/outbox/{id}/suppress:
    post:
      tags: [admin]
      summary: Suppress a causal stream from its head (deliveries:suppress)
      operationId: suppressAdminDelivery
      parameters:
        - $ref: '#/components/parameters/CSRFGuard'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '202': { description: Head plus live descendants terminalized SUPPRESSED }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Mid-stream row — resolve the stream head instead }
        '422': { $ref: '#/components/responses/ValidationFailed' }

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Privileged-mutation idempotency key (max 128 bytes). Binds the
        actor, action, target and request-body hash — same key with a
        different body returns 409.
      schema: { type: string, maxLength: 128 }
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CSRFGuard:
      name: X-CSRF-Token
      in: header
      required: true
      description: |
        Double-submit token — must match the `uptime_csrf` cookie and
        pair with a matching `Origin` header when Origin is sent.
      schema: { type: string }

  schemas:
    Page:
      type: object
      properties:
        next_cursor: { type: string }
        has_more: { type: boolean }
    CheckHistoryRow:
      type: object
      description: Run lifecycle plus accepted result; slot_at is the
        nominal slot, observed_at the real timestamp.
      properties:
        run_id: { type: string, format: uuid }
        slot_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        status:
          type: string
          enum: [RESERVED, RUNNING, COMPLETED, EXCLUDED, INTERRUPTED, STALE]
        outcome: { type: [string, "null"] }
        eligible: { type: [boolean, "null"] }
        success: { type: [boolean, "null"] }
        http_status: { type: [integer, "null"], minimum: 100, maximum: 599 }
        duration_ms: { type: [integer, "null"], minimum: 0 }
        observed_at: { type: [string, "null"], format: date-time }
    IncidentRow:
      type: object
      properties:
        id: { type: string, format: uuid }
        opened_at: { type: string, format: date-time }
        resolved_at: { type: [string, "null"], format: date-time }
        close_reason:
          type: [string, "null"]
          enum: [RECOVERED, CONFIG_CHANGED, DELETED]
        opened_check_id: { type: string, format: uuid }
        resolved_check_id: { type: [string, "null"], format: uuid }
    MonitorStats:
      type: object
      description: |
        window_start/end are the REQUEST; data_start/end the
        REPRESENTED interval. Counts/coverage/latency all share the
        represented bounds; null ratios mean no evidence.
      properties:
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        data_start: { type: [string, "null"], format: date-time }
        data_end: { type: [string, "null"], format: date-time }
        valid_samples: { type: integer, minimum: 0 }
        successes: { type: integer, minimum: 0 }
        failures: { type: integer, minimum: 0 }
        excluded_samples: { type: integer, minimum: 0 }
        expected_samples: { type: integer, minimum: 0 }
        missed_samples: { type: integer, minimum: 0 }
        pending_samples: { type: integer, minimum: 0 }
        coverage: { type: [number, "null"], minimum: 0, maximum: 1 }
        sample_uptime: { type: [number, "null"], minimum: 0, maximum: 1 }
        avg_duration_ms: { type: [number, "null"], minimum: 0 }
        raw_retention_hours: { type: integer }
        hourly_retention_days: { type: integer }
        raw_available_from: { type: [string, "null"], format: date-time }
        resolution:
          type: string
          enum: [raw, hourly, mixed, none]
        is_partial: { type: boolean }
        series:
          type: array
          items: { $ref: '#/components/schemas/StatsBucket' }
    StatsBucket:
      type: object
      properties:
        bucket_start: { type: string, format: date-time }
        valid_samples: { type: integer, minimum: 0 }
        successes: { type: integer, minimum: 0 }
        failures: { type: integer, minimum: 0 }
        excluded_samples: { type: integer, minimum: 0 }
        sample_uptime: { type: [number, "null"], minimum: 0, maximum: 1 }
        avg_duration_ms: { type: [number, "null"], minimum: 0 }
    DashboardSummary:
      type: object
      properties:
        monitors: { type: integer, minimum: 0 }
        active: { type: integer, minimum: 0 }
        paused: { type: integer, minimum: 0 }
        up: { type: integer, minimum: 0 }
        down: { type: integer, minimum: 0 }
        open_incidents: { type: integer, minimum: 0 }
        sample_uptime_24h: { type: [number, "null"], minimum: 0, maximum: 1 }
        recent_incidents:
          type: array
          maxItems: 10
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              monitor_id: { type: string, format: uuid }
              monitor_name: { type: string }
              opened_at: { type: string, format: date-time }
              resolved_at: { type: [string, "null"], format: date-time }
              close_reason: { type: [string, "null"] }
        quota:
          type: object
          required: [used, active, paused, limit, profile, as_of, source]
          properties:
            used: { type: integer, minimum: 0 }
            active: { type: integer, minimum: 0 }
            paused: { type: integer, minimum: 0 }
            limit: { type: integer, minimum: 0 }
            profile: { type: string, enum: [local, hosted-free] }
            as_of: { type: string, format: date-time }
            source: { type: string, enum: [server] }
        as_of: { type: string, format: date-time }
    DataEnvelope:
      type: object
      description: Success wrapper — payload under `data`.
    ErrorEnvelope:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }
              description: Per-field or scope discriminators (safe scopes only — never global counts)
        request_id: { type: string }
    ErrorCode:
      type: string
      enum:
        - BAD_REQUEST
        - UNAUTHENTICATED
        - FORBIDDEN
        - CSRF_REJECTED
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - CONFLICT
        - QUOTA_EXCEEDED
        - ALLOCATION_LIMIT_REACHED
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - VALIDATION_ERROR
        - RATE_LIMITED
        - REAUTH_REQUIRED
        - INTERNAL_ERROR
        - UNAVAILABLE
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, ready, unavailable] }
    User:
      type: object
      required: [id, email, display_name, status, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        created_at: { type: string, format: date-time }
    SessionDTO:
      type: object
      required: [id, device_label, created_at, last_seen_at, expires_at, current]
      properties:
        id: { type: string, format: uuid }
        device_label: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        current: { type: boolean }
    RegisterInput:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, minLength: 3, maxLength: 254 }
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: 12–128 codepoints, 1024-byte wire cap
        display_name: { type: string, maxLength: 120 }
    LoginInput:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        password: { type: string }
    Monitor:
      type: object
      required:
        - id
        - name
        - target_url
        - method
        - interval_seconds
        - timeout_seconds
        - expected_status
        - is_paused
        - health
        - generation
        - next_check_at
        - last_checked_at
        - last_response_time_ms
        - last_error_type
        - freshness
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        target_url: { type: string, format: uri }
        method: { type: string, enum: [GET] }
        interval_seconds: { type: integer, minimum: 60, maximum: 86400 }
        timeout_seconds: { type: integer, minimum: 1, maximum: 10 }
        expected_status: { type: [integer, 'null'], minimum: 200, maximum: 599 }
        is_paused: { type: boolean }
        health: { type: string, enum: [UNKNOWN, UP, DOWN] }
        generation: { type: integer, minimum: 1 }
        next_check_at: { type: string, format: date-time }
        last_checked_at: { type: [string, 'null'], format: date-time }
        last_response_time_ms: { type: [integer, 'null'] }
        last_error_type: { type: [string, 'null'] }
        freshness: { type: [string, 'null'], description: null until the engine lands }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MonitorCreateInput:
      type: object
      required: [name, target_url, interval_seconds, timeout_seconds]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        target_url:
          type: string
          format: uri
          description: http/https only — no userinfo, fragment, port, or private literal IP; DNS/SSRF proof is at dial time
        interval_seconds: { type: integer, minimum: 60, maximum: 86400 }
        timeout_seconds: { type: integer, minimum: 1, maximum: 10 }
        expected_status: { type: integer, minimum: 200, maximum: 599 }
    MonitorPatchInput:
      type: object
      # Consumed via allOf — strictness lives in unevaluatedProperties
      # at the compose site (additionalProperties can't see siblings).
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        target_url: { type: string, format: uri }
        interval_seconds: { type: integer, minimum: 60, maximum: 86400 }
        timeout_seconds: { type: integer, minimum: 1, maximum: 10 }
        expected_status: { type: [integer, 'null'], minimum: 200, maximum: 599 }
    ExpectedGeneration:
      type: object
      required: [expected_generation]
      additionalProperties: false
      properties:
        expected_generation: { type: integer, minimum: 1 }
    ExpectedVersion:
      type: object
      required: [expected_version]
      additionalProperties: false
      properties:
        expected_version: { type: integer, minimum: 1 }
    Channel:
      type: object
      required:
        - id
        - label
        - kind
        - status
        - enabled
        - destination_mask
        - verified_at
        - version
        - created_at
        - updated_at
      description: |
        The ciphertext and verification receipt never leave the service
        boundary. `destination_mask` reveals at most the last 4 chars.
      properties:
        id: { type: string, format: uuid }
        label: { type: string, maxLength: 120 }
        kind: { type: string, enum: [TELEGRAM] }
        status: { type: string, enum: [PENDING_VERIFICATION, VERIFIED, DISABLED] }
        enabled: { type: boolean }
        destination_mask: { type: [string, 'null'], example: "•••5123" }
        verified_at: { type: [string, 'null'], format: date-time }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ChannelCreateInput:
      type: object
      required: [label]
      additionalProperties: false
      description: Label only — destination is operator-CLI territory.
      properties:
        label: { type: string, minLength: 1, maxLength: 120 }

  responses:
    BadRequest:
      description: Malformed body/query
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: BAD_REQUEST, message: invalid request body }
            request_id: "req_01H…"
    Unauthenticated:
      description: Missing/expired/revoked session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: UNAUTHENTICATED, message: authentication required }
            request_id: "req_01H…"
    Forbidden:
      description: Authenticated but not permitted (admin surfaces)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: FORBIDDEN, message: insufficient permissions }
            request_id: "req_01H…"
    ValidationFailed:
      description: Bounded field validation failure
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: VALIDATION_ERROR, message: validation failed }
            request_id: "req_01H…"
    Conflict:
      description: Stale expected_version or idempotency conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: CONFLICT, message: conflicting or stale version }
            request_id: "req_01H…"
    AdminForbidden:
      description: FORBIDDEN or REAUTH_REQUIRED on a privileged surface
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: REAUTH_REQUIRED, message: recent authentication required }
            request_id: "req_01H…"
    CSRFRejected:
      description: CSRF pair missing/mismatched or Origin rejected
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: CSRF_REJECTED, message: csrf check failed }
            request_id: "req_01H…"
    NotFound:
      description: Missing OR foreign-owned — indistinguishable by design
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: NOT_FOUND, message: not found }
            request_id: "req_01H…"
    MethodNotAllowed:
      description: Wrong verb for a registered path
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: METHOD_NOT_ALLOWED, message: method not allowed }
            request_id: "req_01H…"
    ValidationError:
      description: Schema/policy failure — `fields` names the offenders
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: VALIDATION_ERROR
              message: validation failed
              fields: { target_url: "scheme must be http or https" }
            request_id: "req_01H…"
    GenerationConflict:
      description: Stale expected_generation/expected_version — re-read and retry
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: CONFLICT, message: stale generation — re-read and retry }
            request_id: "req_01H…"
    RateLimited:
      description: Attempt budget exhausted
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: RATE_LIMITED, message: too many attempts }
            request_id: "req_01H…"
