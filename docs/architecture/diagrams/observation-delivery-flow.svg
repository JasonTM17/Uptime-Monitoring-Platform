<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title description">
<title id="title">Observation and notification flow</title>
<desc id="description">The scheduler commits a reservation before bounded workers perform HTTP checks. Fenced finalization atomically records results, state, incidents and outbox intents. Only incident transitions with eligible bound recipients append outbox intents. Ordinary unchanged-health samples stop at result/state finalization. After commit, the dispatcher leases an actual intent, revalidates its recipient, applies rate limits, sends through Telegram and records the outcome. Only due retries or expired leases return to the delivery loop.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
<marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
</defs>
<rect width="1440" height="1040" rx="18" fill="#ffffff"/>
<text x="56" y="68" font-size="34" fill="#111827" font-weight="600" text-anchor="start">Observation and notification flow</text>
<text x="56" y="106" font-size="18" fill="#6b7280" font-weight="400" text-anchor="start">Network calls stay outside database transactions; queued does not mean delivered</text>
<rect x="720" y="146" width="688" height="230" rx="14" fill="#f6fcf8" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="744" y="169" font-size="12" fill="#16a34a" font-weight="600" text-anchor="start">ONE FINALIZATION TRANSACTION</text>
