<text x="482" y="1008" font-size="16" fill="#6b7280" font-weight="400" text-anchor="start">Database operation</text>
<path d="M810,1003 H854" fill="none" stroke="#9333ea" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-purple)" stroke-dasharray="7 5"/>
<text x="868" y="1008" font-size="16" fill="#6b7280" font-weight="400" text-anchor="start">Asynchronous delivery / retry</text>
</svg>
