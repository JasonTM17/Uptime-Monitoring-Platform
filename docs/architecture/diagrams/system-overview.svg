<text x="722" y="621" font-size="16" fill="#6b7280" font-weight="400" text-anchor="start">Rollup · retention · reclaim</text>
<text x="722" y="644" font-size="16" fill="#6b7280" font-weight="400" text-anchor="start">Bounded background work</text>
