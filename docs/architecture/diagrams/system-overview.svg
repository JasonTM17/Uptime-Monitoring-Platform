<text x="722" y="277" font-size="16" fill="#6b7280" font-weight="400" text-anchor="start">DB-backed admission</text>
<text x="722" y="300" font-size="16" fill="#6b7280" font-weight="400" text-anchor="start">Bounded queue + HTTP checks</text>
