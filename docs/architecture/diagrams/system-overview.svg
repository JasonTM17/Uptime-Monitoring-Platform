<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title description">
<title id="title">System architecture</title>
<desc id="description">A React browser client calls one Go application. API, scheduler/workers, observation writer, dispatcher and maintenance share PostgreSQL. The durable outbox is a database table. Workers check public HTTP(S) targets; the configured dispatcher sends through Telegram. Operator CLIs have separate direct database authority.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<defs>
