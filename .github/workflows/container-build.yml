name: container-build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing v<semver> tag whose commit is exactly the main source SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: container-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: validate release ref and Docker Hub target
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "container builds must be dispatched from main"
            exit 1
          fi
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "release version is malformed"
            exit 1
          }
          test "$DOCKERHUB_NAMESPACE" = "nguyenson1710/uptime-monitoring-platform" || {
            echo "Docker Hub target does not match the owner-confirmed repository"
            exit 1
          }
          tag_sha="$(git rev-parse --verify "refs/tags/$RELEASE_VERSION^{commit}")"
          test "$tag_sha" = "$GITHUB_SHA" || {
            echo "release tag must point to the exact checked-out source SHA"
            exit 1
          }
      - name: enable containerd image store for attestations
        run: |
          set -euo pipefail
          # The image scanner also mounts the existing daemon's default socket.
          test "${DOCKER_HOST:-unix:///var/run/docker.sock}" = "unix:///var/run/docker.sock"
          test "$(docker context inspect --format '{{.Endpoints.docker.Host}}')" = "unix:///var/run/docker.sock"
          daemon_config="$RUNNER_TEMP/release-docker-daemon.json"
          trap 'rm -f "$daemon_config" "$daemon_config.merged"' EXIT
          if sudo test -f /etc/docker/daemon.json; then
            sudo cat /etc/docker/daemon.json > "$daemon_config"
          else
            printf '{}\n' > "$daemon_config"
          fi
          jq 'if type != "object" then error("Docker daemon config must be an object")
              elif (.features != null and (.features | type) != "object") then
                error("Docker daemon features must be an object or null")
              else .features = (.features // {}) | .features["containerd-snapshotter"] = true end' \
            "$daemon_config" > "$daemon_config.merged"
          sudo install -d -m 0755 /etc/docker
          sudo install -m 0644 "$daemon_config.merged" /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{json .DriverStatus}}' |
            jq -e 'any(.[]; .[0] == "driver-type" and .[1] == "io.containerd.snapshotter.v1")'
      - name: build, attest, and scan one source artifact
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          node scripts/build-release-image.mjs \
            --version "$RELEASE_VERSION" \
            --dockerhub-namespace "$DOCKERHUB_NAMESPACE" \
            --output artifacts/release/image-manifest.json
      - name: verify local OCI digest chain
        run: >-
          node scripts/verify-container-release.mjs
          --manifest artifacts/release/image-manifest.json
          --output artifacts/release/local-verification.json
          --stage local
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-artifact
          path: |
            artifacts/release/image-manifest.json
            artifacts/release/uptime-platform-*.oci.tar
            artifacts/release/sbom.spdx.json
            artifacts/release/provenance.json
            artifacts/release/govulncheck-target
            artifacts/release/context-proof.json
          if-no-files-found: error
