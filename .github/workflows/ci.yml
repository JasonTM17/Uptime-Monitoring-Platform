name: ci

# Definition only — a workflow file's existence is not a CI run. Local gate
# results are recorded per commit; live CI receipts require owner-authorized
# public-history preparation first.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -count=1 ./...
      - name: build
        run: go build ./cmd/api

  go-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: uptime_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uptime_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U uptime_test -d uptime_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: migrate schema
        env:
          PGPASS: postgres
        run: >-
          docker run --rm --network host
          -v ${{ github.workspace }}/migrations:/migrations
          migrate/migrate:v4.20.1
          -path /migrations
          -database "postgres://uptime_test:${PGPASS}@localhost:5433/uptime_test?sslmode=disable"
          up
      - name: integration tests
        # -p 1: all suites share one disposable database; parallel
        # packages would trample each other's fixtures.
        run: >-
          go test -count=1 -race -p 1 -tags=integration
          ./internal/auth/ ./internal/engine/ ./internal/incident/
          ./internal/monitor/ ./internal/notification/ ./internal/admin/
        env:
          PGPASS: postgres
          TEST_DATABASE_URL: postgres://uptime_test:${{ env.PGPASS }}@localhost:5433/uptime_test?sslmode=disable

  web-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        run: npm --prefix web ci
      - name: lint
        run: npm --prefix web run lint
      - name: typecheck
        run: npm --prefix web run typecheck
      - name: test
        run: npm --prefix web run test
      - name: build
        run: npm --prefix web run build
      - name: no secrets in bundle
        run: >-
          ! grep -riE "dev-test-pw|postgres://|bot.?token|session.?canary"
          web/dist/
      - name: e2e
        run: >-
          cd web && npx playwright install --with-deps chromium
          && npx playwright test

  staged-secrets-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - run: node scripts/check-staged-secrets.mjs --self-test
