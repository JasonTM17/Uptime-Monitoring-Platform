name: uptime-platform

# Local PostgreSQL (persistent learning data) lives on the "local" network.
# Disposable test services live on the isolated "test" network and never share
# volumes or credential authority with local data. Migration is a separate job,
# never an application startup side effect. All host ports bind to loopback.

services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks: [local]

  postgres-test:
    image: postgres:17.11
    profiles: ["test"]
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${TEST_POSTGRES_DB:?set in .env}
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [test]

  migrate:
    image: migrate/migrate:v4.20.1
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
      - ./scripts/migrate-entrypoint.sh:/scripts/migrate-entrypoint.sh:ro
    entrypoint: ["sh", "/scripts/migrate-entrypoint.sh"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:?set in .env}?sslmode=disable
      MIGRATE_TARGET: local
      MIGRATE_ALLOW_DESTRUCTIVE: "false"
    networks: [local]

  migrate-test:
    image: migrate/migrate:v4.20.1
    profiles: ["test"]
    depends_on:
      postgres-test:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
      - ./scripts/migrate-entrypoint.sh:/scripts/migrate-entrypoint.sh:ro
    entrypoint: ["sh", "/scripts/migrate-entrypoint.sh"]
    environment:
      DATABASE_URL: postgres://${TEST_POSTGRES_USER:?set in .env}:${TEST_POSTGRES_PASSWORD:?set in .env}@postgres-test:5432/${TEST_POSTGRES_DB:?set in .env}?sslmode=disable
      MIGRATE_TARGET: test
      MIGRATE_ALLOW_DESTRUCTIVE: "false"
    networks: [test]

  app:
    # Release image (C78): nonroot distroless, single API binary.
    # Build context is pre-gated by scripts/check-build-context.mjs.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${APP_VERSION:-dev}
        REVISION: ${APP_REVISION:-local}
    image: uptime-platform:local
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: local
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      ENGINE_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      # Channel keyring only needed when NOTIFICATIONS_ENABLED=true.
      CHANNEL_ENCRYPTION_KEY: ${CHANNEL_ENCRYPTION_KEY:-}
      CHANNEL_READ_KEYRING: ${CHANNEL_READ_KEYRING:-}
      CHANNEL_WRITE_KEY_VERSION: ${CHANNEL_WRITE_KEY_VERSION:-}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-false}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    # Runtime contract: read-only root (the process writes nothing to
    # disk), no capabilities, no privilege escalation. Signals reach
    # PID 1 directly — the bounded shutdown needs the raw SIGTERM.
    read_only: true
    tmpfs:
      - /tmp:size=8m,uid=65532,gid=65532
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    restart: unless-stopped
    networks: [local]

  go-test:
    image: golang:1.27.3
    profiles: ["test"]
    working_dir: /src
    volumes:
      # Source dirs only — never the whole repo, which would carry .env
      # and other local secrets into the test container.
      - ./cmd:/src/cmd:ro
      - ./internal:/src/internal:ro
      - ./migrations:/src/migrations:ro
      - ./go.mod:/src/go.mod:ro
      - ./go.sum:/src/go.sum:ro
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      postgres-test:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgres://${TEST_POSTGRES_USER}:${TEST_POSTGRES_PASSWORD}@postgres-test:5432/${TEST_POSTGRES_DB}?sslmode=disable
      CGO_ENABLED: "1"
    command: ["go", "test", "-race", "-tags=integration", "-count=1", "./..."]
    networks: [test]

volumes:
  pgdata:
  go-mod-cache:
  go-build-cache:

networks:
  local:
  test:
